name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -S .

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $name = "BlackHole-${{ github.ref_name }}-windows"
          New-Item -ItemType Directory -Path $name
          Copy-Item build/Release/black_hole.exe $name/
          Copy-Item shaders $name/shaders -Recurse
          Copy-Item packaging/README.txt $name/
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "BlackHole-${{ github.ref_name }}-windows.zip" `
            --title "${{ github.ref_name }}" --generate-notes
